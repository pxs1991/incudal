name: Agent Build & Release

on:
  push:
    branches:
      - main
      - dev
      - niyy          # 新增：推送至 niyy 分支时触发
    paths:
      - 'agent/**'
      - 'install.sh'
      - 'internal/api/agent/**'
      - '.github/workflows/agent-release.yml'
  pull_request:
    branches:
      - main
      - niyy          # 新增：向 niyy 分支发起 PR 时也可触发（可选）
    paths:
      - 'agent/**'
      - 'install.sh'
      - 'internal/api/agent/**'
      - '.github/workflows/agent-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish an Agent GitHub Release using the version in agent/VERSION.'
        required: true
        type: boolean
        default: false

env:
  GO_VERSION: '1.21'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Read agent version
        id: version
        run: |
          VERSION=$(cat agent/VERSION | tr -d '[:space:]')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if version file changed
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q 'agent/VERSION'; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        run: go test ./...

      - name: Build agent binaries
        run: bash agent/scripts/build-release.sh

      - name: Upload build artifacts (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: agent-build
          path: agent/dist/
          retention-days: 7

      - name: Prepare release assets (keep original names)
        run: |
          mkdir -p release_assets
          cp agent/dist/incudal-agent-linux-amd64 release_assets/incudal-agent-linux-amd64
          cp agent/dist/incudal-agent-linux-arm64 release_assets/incudal-agent-linux-arm64
          # Optionally also include manifest.json if needed
          cp agent/dist/manifest.json release_assets/manifest.json

      - name: Create GitHub Release
        id: release
        if: |
          (github.event_name == 'push' && steps.changes.outputs.version_changed == 'true') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-${{ env.VERSION }}
          name: Incudal Agent ${{ env.VERSION }}
          body: |
            ## Incudal Agent ${{ env.VERSION }}
            Auto-generated release from GitHub Actions.
            Please refer to the [README](https://github.com/${{ github.repository }}) for installation instructions.
          files: |
            release_assets/incudal-agent-linux-amd64
            release_assets/incudal-agent-linux-arm64
            release_assets/manifest.json
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
